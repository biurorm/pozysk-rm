<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#094d47">
  <title>Pozysk, RM Nieruchomości</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="app">

  <header>
    <div class="header-left">
      <img src="logo.png" alt="RM Nieruchomości" class="header-logo">
      <div class="subtitle">Pozysk</div>
    </div>
    <div class="header-right">
      <span class="wersja" data-wersja title="Wersja aplikacji"></span>
      <button class="icon-btn small-txt" id="btn-wyloguj" hidden>Wyloguj</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <!-- LOGOWANIE -->
  <section class="screen waski" id="ekran-logowanie" hidden>
    <div class="card">
      <div class="card-title">Zaloguj się</div>
      <p class="muted">Ten sam e-mail i hasło co w aplikacji Zadania RM.</p>
      <form id="form-logowanie">
        <label>E-mail <input type="email" id="log-email" autocomplete="username" autocapitalize="off" required></label>
        <label>Hasło <input type="password" id="log-haslo" autocomplete="current-password" required></label>
        <button class="btn btn-main" type="submit">Zaloguj</button>
        <div class="err" id="log-blad"></div>
      </form>
    </div>
  </section>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="dzwonie" class="on">📞 Dzwonię <span class="tab-ile" id="tab-ile"></span></button>
    <button data-tab="wszystkie">📋 Wszystkie</button>
    <button data-tab="wyniki">📊 Wyniki</button>
    <button data-tab="listy">⚙️ Listy</button>
  </nav>

  <!-- DZWONIĘ: kogo dziś obdzwonić -->
  <section class="screen waski" id="ekran-dzwonie" hidden>
    <button class="btn btn-main btn-big" data-akcja="nowy">＋ Nowy kontakt z ogłoszenia</button>
    <div class="chips filtr-kto" id="dz-kto"></div>
    <div id="dz-lista"></div>
  </section>

  <!-- WSZYSTKIE: cały arkusz, szukanie, filtry, eksport -->
  <section class="screen" id="ekran-wszystkie" hidden>
    <div class="szukaj-wiersz">
      <input type="search" id="w-szukaj" placeholder="Szukaj: telefon, imię, miasto, link, uwagi, LP" autocomplete="off">
      <button class="btn btn-main" data-akcja="nowy">＋ Nowy</button>
    </div>
    <div class="chips" id="w-filtry"></div>
    <div id="w-lista"></div>
  </section>

  <!-- WYNIKI -->
  <section class="screen waski" id="ekran-wyniki" hidden>
    <div class="chips" id="wy-okres"></div>
    <div id="wy-tresc"></div>
  </section>

  <!-- LISTY DO WYBIERANIA + AGENCI + IMPORT -->
  <section class="screen waski" id="ekran-listy" hidden>
    <div id="li-tresc"></div>
  </section>

  <!-- ARKUSZ (wysuwany od dołu) -->
  <div class="tlo" id="tlo" hidden></div>
  <div class="arkusz" id="arkusz" hidden role="dialog" aria-modal="true">
    <div class="arkusz-uchwyt"></div>
    <div class="row-between">
      <div class="ark-nr" id="ark-nr"></div>
      <button class="icon-btn dark" id="ark-zamknij" aria-label="Zamknij">✕</button>
    </div>
    <div id="ark-tresc"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="config.js?v=2"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
